name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - macos-build
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg (optional)
        run: brew install create-dmg || true

      - name: Build macOS DMG
        run: bash installer/build_macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAgentsGUI-dmg
          path: dist/TradingAgentsGUI.dmg

      - name: Upload raw dist folder (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: dist


