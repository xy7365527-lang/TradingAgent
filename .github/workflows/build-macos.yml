name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - macos-build
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install create-dmg (optional)
        run: brew install create-dmg || true

      - name: Build macOS DMG
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          # 当由 tag 触发时，github.ref_name 即 tag 名，如 v0.1.0；提取纯版本号
          if [[ "${APP_VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            APP_VERSION=${APP_VERSION#v}
          else
            # 分支触发时，退回 pyproject.toml 中的 version
            APP_VERSION=""
          fi
          export APP_VERSION
          bash installer/build_macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAgentsGUI-dmg
          path: dist/TradingAgentsGUI-*.dmg

      - name: Upload raw dist folder (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TradingAgentsGUI-dmg
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: dist/TradingAgentsGUI-*.dmg


